# JoyHub / light fork overlay for compose.release.yml
#
# Usage:
#   docker compose -p joyhub \
#     --env-file .env.release \
#     -f compose.release.yml \
#     -f compose.light.release.yml \
#     up -d
#
# Copy .env.light.release.example -> .env.release and edit before first start.

services:
  server:
    environment:
      OAUTH2_FEISHU_CLIENT_ID: ${OAUTH2_FEISHU_CLIENT_ID:?required}
      OAUTH2_FEISHU_CLIENT_SECRET: ${OAUTH2_FEISHU_CLIENT_SECRET:?required}
      OAUTH2_FEISHU_SCOPE: ${OAUTH2_FEISHU_SCOPE:-contact:user.base:readonly}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FEISHU_REDIRECT_URI: ${SKILLHUB_PUBLIC_BASE_URL}/login/oauth2/code/feishu
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_CLIENT: DEBUG
      LOGGING_LEVEL_COM_IFLYTEK_SKILLHUB_AUTH_OAUTH: DEBUG
      HERMES_SKILLHUB_JWT_SECRET: ${HERMES_SKILLHUB_JWT_SECRET:?required}
      HERMES_SKILLHUB_JWT_ISSUER: ${HERMES_SKILLHUB_JWT_ISSUER:-hermes-agent}
      SKILLHUB_API_TOKENS_ENABLED: ${SKILLHUB_API_TOKENS_ENABLED:-false}
      SKILLHUB_GOVERNANCE_ENABLED: ${SKILLHUB_GOVERNANCE_ENABLED:-false}
      SKILLHUB_PROFILE_MACHINE_REVIEW_ENABLED: ${SKILLHUB_PROFILE_MACHINE_REVIEW_ENABLED:-false}
      SKILLHUB_PROFILE_HUMAN_REVIEW_ENABLED: ${SKILLHUB_PROFILE_HUMAN_REVIEW_ENABLED:-false}
      SKILLHUB_WEB_BASE_URL: ${SKILLHUB_PUBLIC_BASE_URL:?required}
      SKILLHUB_STORAGE_PROVIDER: ${SKILLHUB_STORAGE_PROVIDER:-local}
      JOYHUB_CATALOG_SEED_BINGO_FRENZY_ENABLED: ${JOYHUB_CATALOG_SEED_BINGO_FRENZY_ENABLED:-false}
      JOYHUB_CATALOG_SEED_BINGO_FRENZY_OWNER_ID: ${JOYHUB_CATALOG_SEED_BINGO_FRENZY_OWNER_ID:-local-admin}
      JOYHUB_CATALOG_SEED_BINGO_VOYAGE_ENABLED: ${JOYHUB_CATALOG_SEED_BINGO_VOYAGE_ENABLED:-false}
      JOYHUB_CATALOG_SEED_BINGO_VOYAGE_OWNER_ID: ${JOYHUB_CATALOG_SEED_BINGO_VOYAGE_OWNER_ID:-local-admin}
      JOYHUB_CATALOG_SEED_BINGO_VOYAGE_PRIMARY_NAMESPACE_SLUG: ${JOYHUB_CATALOG_SEED_BINGO_VOYAGE_PRIMARY_NAMESPACE_SLUG:-gestalt}
      JOYHUB_CATALOG_SEED_BINGO_VOYAGE_VISIBILITY_DEPARTMENT_EXTERNAL_ID: ${JOYHUB_CATALOG_SEED_BINGO_VOYAGE_VISIBILITY_DEPARTMENT_EXTERNAL_ID:-}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
