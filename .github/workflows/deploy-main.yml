name: Deploy Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate Main
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Ensure scripts are executable
        run: chmod +x server/mvnw scripts/deploy-main-runtime.sh scripts/joyhub-deploy-remote.sh

      - name: Run backend tests
        run: make test-backend-app

      - name: Install frontend dependencies
        run: make web-install-ci

      - name: Run frontend checks
        run: |
          make typecheck-web
          make lint-web

      - name: Validate deployment contract
        run: bash scripts/tests/main-deployment-test.sh

  build:
    name: Build ARM64 ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile
            image: skillhub-server
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
            image: skillhub-web
          - name: scanner
            context: ./scanner
            dockerfile: ./scanner/Dockerfile
            image: skillhub-scanner
          - name: deployment-runner
            context: ./runner
            dockerfile: ./runner/Dockerfile
            image: joyhub-deployment-runner

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main-${{ github.sha }}
          cache-from: type=gha,scope=production-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.name }}

  deploy:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          [[ -n "${PROD_SSH_HOST}" ]] || { echo "::error::Missing PROD_SSH_HOST"; exit 1; }
          [[ -n "${PROD_SSH_KEY}" ]] || { echo "::error::Missing PROD_SSH_KEY"; exit 1; }
          [[ -n "${PROD_SSH_KNOWN_HOSTS}" ]] || { echo "::error::Missing PROD_SSH_KNOWN_HOSTS"; exit 1; }

      - name: Prepare SSH credentials
        id: ssh
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          key_file="${RUNNER_TEMP}/production.key"
          known_hosts_file="${RUNNER_TEMP}/production.known_hosts"
          printf '%s\n' "${PROD_SSH_KEY}" > "${key_file}"
          printf '%s\n' "${PROD_SSH_KNOWN_HOSTS}" > "${known_hosts_file}"
          chmod 600 "${key_file}" "${known_hosts_file}"
          echo "key_file=${key_file}" >> "${GITHUB_OUTPUT}"
          echo "known_hosts_file=${known_hosts_file}" >> "${GITHUB_OUTPUT}"

      - name: Deploy immutable image set
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.repository_owner }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          chmod +x scripts/deploy-main-runtime.sh
          scripts/deploy-main-runtime.sh \
            --host "${PROD_SSH_HOST}" \
            --user "${PROD_SSH_USER:-joyhub-deploy}" \
            --port "${PROD_SSH_PORT:-22}" \
            --key-file "${{ steps.ssh.outputs.key_file }}" \
            --known-hosts-file "${{ steps.ssh.outputs.known_hosts_file }}" \
            --deploy-tag "main-${GITHUB_SHA}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish deployment summary
        run: |
          {
            echo "### JoyHub production deployed"
            echo
            echo "- Host: \`13.229.10.38\`"
            echo "- Architecture: \`linux/arm64\`"
            echo "- Image tag: \`main-${GITHUB_SHA}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
