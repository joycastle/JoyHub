name: PR CLI

on:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: cli
      - run: bun run lint
        working-directory: cli
      - run: bun run typecheck
        working-directory: cli
      - run: bun test
        working-directory: cli
      - run: bun run build
        working-directory: cli
      - run: npm pack --dry-run
        working-directory: cli
      - name: Exercise official Skills through the packed npm CLI
        if: runner.os == 'Linux'
        run: python3 scripts/test-official-agent-skills-e2e.py
      - run: node dist/index.js version
        working-directory: cli

  contracts-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate official agent skills
        run: python3 scripts/validate-official-agent-skills.py
      - name: Check CLI/API contract acknowledgement
        run: python3 scripts/check-cli-api-contract.py --base "${{ github.event.pull_request.base.sha }}"
      - name: Test release helper
        run: bash scripts/tests/publish-cli-test.sh
