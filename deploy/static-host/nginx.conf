server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/apps/(?<app>[a-z0-9]+(?:-[a-z0-9]+)*)/(?<asset>.*)$ {
        alias /srv/static/published/$app/$asset;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
